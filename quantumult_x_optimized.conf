[general]
profile_img_url = https://gitlab.com/lodepuly/iconlibrary/raw/master/App_icon/144px/Quantumult_X.png
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
server_check_timeout = 2000
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
prefer-doh3
no-system
server = 10.0.0.1:7874, included_ssids = PHICOMM_5G
doh-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query, excluded_ssids = PHICOMM_5G

[policy]
url-latency-benchmark = 香港, server-tag-regex = ^(?=.*((?i)🇭🇰|香港|(\bHK|Hong\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
url-latency-benchmark = 台湾, server-tag-regex = ^(?=.*((?i)🇹🇼|台湾|(\bTW|Taiwan\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
url-latency-benchmark = 日本, server-tag-regex = ^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\bJP|Japan\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark = 韩国, server-tag-regex = ^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\bKR|Korea\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
url-latency-benchmark = 美国, server-tag-regex = ^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\bUS|United States\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
url-latency-benchmark = 新加坡, server-tag-regex = ^(?=.*((?i)🇸🇬|新加坡|狮|(\bSG|Singapore\b)))(?!.*((?i)回国|校园|游戏|(\bGAME\b))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark = 服务优选, server-tag-regex = ^(?=.*((?i)🇸🇬|🇭🇰|🇯🇵|新加坡|狮|香港|日本|东京|大阪|(\bSG|Singapore|HK|Hong|JP|Japan)\b))(?!(.*((?i)回国|校园|游戏|官网|客服|机场|订阅|流量|到期|(\bGAME\b)))).*$, check-interval = 300, alive-checking = true, tolerance = 30, fallback = 全球自动, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
url-latency-benchmark = 全球自动, server-tag-regex = ^(?=.*.+)(?!.*((?i)回国|校园|教育|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|群|(\bGAME|USE|USED|TOTAL|EXPIRE|EMAIL\b)|(\d{4}-\d{2}-\d{2}|\dG))).*$, check-interval = 300, alive-checking = true, tolerance = 30, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
static = 📽 国内视频, direct, 全球自动, reject, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png
static = 服务直连, direct, 香港, 台湾, 日本, 韩国, 美国, 新加坡, 全球自动, reject

